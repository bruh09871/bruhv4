<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bruh OS</title>
<style>
html, body { margin:0; padding:0; width:100%; height:100%; font-family:sans-serif; background:black; color:white; overflow:hidden; }
.vm-container { width:90vw; height:80vh; border:2px solid white; border-radius:12px; overflow:hidden; margin:20px auto 0 auto; z-index:1; position:relative; }
.controls { display:flex; justify-content:center; gap:20px; margin-top:10px; z-index:1; position:relative; }
button { padding:10px 20px; border:2px solid white; border-radius:12px; background:black; color:white; cursor:pointer; transition:all 0.2s ease; }
button:hover { background:white; color:black; transform:scale(1.05); }
canvas { position:absolute; top:0; left:0; z-index:0; pointer-events:none; }
#main-screen { position:relative; width:100%; height:100%; }
</style>
</head>
<body>

<div id="main-screen">
  <canvas id="bg-canvas"></canvas>
  <div class="vm-container" id="hyperbeam-container"></div>
  <div class="controls">
    <button id="reset-btn">Reset</button>
    <button id="fullscreen-btn">Fullscreen</button>
  </div>
</div>

<script type="module">
import Hyperbeam from "https://cdn.jsdelivr.net/npm/@hyperbeam/web/dist/hyperbeam.min.js";

window.addEventListener("load", ()=> {
  // ---------- Particles ----------
  const canvas = document.getElementById("bg-canvas");
  const ctx = canvas.getContext("2d");
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const particles = Array.from({ length: 70 }).map(() => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    size: Math.random() * 2 + 1,
    speedX: Math.random() * 0.3 - 0.15,
    speedY: Math.random() * 0.3 - 0.15,
  }));

  function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles.forEach(p=>{
      p.x += p.speedX;
      p.y += p.speedY;
      if(p.x<0||p.x>canvas.width)p.speedX*=-1;
      if(p.y<0||p.y>canvas.height)p.speedY*=-1;
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
      ctx.fillStyle="white";
      ctx.fill();
    });
    requestAnimationFrame(animate);
  }
  animate();

  // ---------- Hyperbeam VM ----------
  const vmContainer = document.getElementById("hyperbeam-container");
  const EMBED_URL = "https://9v9uzaxrpyew7sym3zcn2jzqn.hyperbeam.com/TnztQ23hQ2uGwiJfMMv1uA?token=gv1ZBugMT9eazHQcV4D2Cz4ZlY4IRD7BjWkzdiJh4ZI";
  
  // Load VM after a tiny delay to let canvas render
  setTimeout(()=> {
    Hyperbeam(vmContainer, EMBED_URL);
  }, 100);

  // ---------- Buttons ----------
  const resetBtn = document.getElementById("reset-btn");
  const fullscreenBtn = document.getElementById("fullscreen-btn");

  resetBtn.addEventListener("click", ()=> window.location.reload());
  fullscreenBtn.addEventListener("click", ()=> {
    const el = document.documentElement;
    if(el.requestFullscreen){
      el.requestFullscreen();
    } else if(el.webkitRequestFullscreen){
      el.webkitRequestFullscreen();
    }
  });

  // ---------- Resize canvas ----------
  window.addEventListener("resize", ()=> {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  });
});
</script>

</body>
</html>
